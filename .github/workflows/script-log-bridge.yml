name: In-game script log regression
on:
  push:
    paths:
      - 'SPRX/t7_lua.cpp'
      - 'SPRX/tests/game_log_bridge_checks.py'
      - '.github/workflows/script-log-bridge.yml'
  pull_request:
    paths:
      - 'SPRX/t7_lua.cpp'
      - 'SPRX/tests/game_log_bridge_checks.py'
      - '.github/workflows/script-log-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  script-log:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 SPRX/tests/game_log_bridge_checks.py
