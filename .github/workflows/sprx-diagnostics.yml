name: SPRX diagnostics

on:
  push:
    paths:
      - 'Lua/**'
      - 'SPRX/t7_log.cpp'
      - 'SPRX/t7_maps.cpp'
      - 'SPRX/t7_share.cpp'
      - 'SPRX/t7_config.cpp'
      - 'SPRX/t7_lua.cpp'
      - 'SPRX/t7_lua.hpp'
      - 'SPRX/t7_lua_files.hpp'
      - 'SPRX/diagnostic_ring.hpp'
      - 'SPRX/script_error_budget.hpp'
      - 'SPRX/tests/**'
      - '.github/workflows/sprx-diagnostics.yml'
  pull_request:
    paths:
      - 'Lua/**'
      - 'SPRX/**'
      - '.github/workflows/sprx-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Exercise script error budgets and diagnostic hooks
        run: |
          mkdir -p build/diagnostics
          g++ -std=c++20 -Wall -Wextra -Werror -O1 -pthread SPRX/tests/script_error_budget_tests.cpp -o build/diagnostics/error-budget
          build/diagnostics/error-budget
          g++ -std=c++20 -Wall -Wextra -Werror -O1 -pthread -fsanitize=address,undefined SPRX/tests/diagnostic_ring_tests.cpp -o build/diagnostics/diagnostic-ring
          build/diagnostics/diagnostic-ring
          python3 SPRX/tests/diagnostic_hook_checks.py
          python3 SPRX/tests/bg_cache_snapshot_checks.py
          python3 SPRX/tests/missing_import_lifetime_checks.py
          python3 SPRX/tests/game_log_bridge_checks.py
          python3 SPRX/tests/storage_safety_checks.py
          python3 SPRX/tests/lua_file_roots_checks.py
          python3 SPRX/tests/map_fastfile_route_checks.py
          python3 SPRX/tests/gpu_progress_checks.py
      - name: Check companion Lua syntax and recovery callbacks
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
          python3 SPRX/tests/lua_menu_recovery_checks.py /usr/bin/lua5.1
