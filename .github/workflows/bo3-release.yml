name: BO3 Quiet Release

on:
  schedule:
    - cron: '27 * * * *'
  workflow_run:
    workflows: [BO3 Auto Build]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  issues: read

concurrency:
  group: bo3-quiet-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'Hi6795/PS4-BO3-Customs' && vars.BO3_AUTO_RELEASE_ENABLED != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify the latest candidate and publish a complete prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          BO3_RELEASE_QUIET_HOURS: ${{ vars.BO3_RELEASE_QUIET_HOURS }}
        run: python3 .github/scripts/release.py
